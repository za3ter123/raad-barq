<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barq Racing · AI Assistant</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#000;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #ui{position:fixed;left:0;right:0;bottom:0;pointer-events:none;
      font-family:-apple-system,'Segoe UI',sans-serif;text-align:center;
      padding:56px 22px calc(26px + env(safe-area-inset-bottom));
      background:linear-gradient(to top,rgba(0,0,0,.92) 45%,rgba(0,0,0,0));
      display:flex;flex-direction:column;align-items:center;gap:10px;}
  #ui>p,#hint{width:100%;max-width:640px;}
  #ui p:empty{display:none;}
  #state{display:none;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
         border:1px solid rgba(103,201,250,.35);background:rgba(103,201,250,.08);
         color:#67C9FA;font-size:.8rem;font-weight:600;letter-spacing:.08em;}
  body:not([data-state=idle]) #state{display:inline-flex;}
  .dot{width:8px;height:8px;border-radius:50%;background:#67C9FA;
       animation:pulse 1.1s ease-in-out infinite;}
  body[data-state=thinking] .dot{animation-duration:.6s;}
  @keyframes pulse{50%{opacity:.25;transform:scale(.7);}}
  #heard{font-size:.95rem;line-height:1.45;color:rgba(103,201,250,.6);}
  #reply{font-size:clamp(1.1rem,4.4vw,1.45rem);line-height:1.5;font-weight:500;color:#e6f6ff;
         text-shadow:0 0 12px rgba(103,201,250,.45);}
  #hint{display:none;flex-direction:column;gap:4px;}
  body[data-state=idle] #hint{display:flex;}
  #hintEn{font-size:1.05rem;font-weight:600;color:#67C9FA;}
  #hintAr{font-size:1rem;color:rgba(103,201,250,.6);}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;
       justify-content:center;background:rgba(0,0,0,.85);color:#67C9FA;border:0;cursor:pointer;
       font-family:-apple-system,'Segoe UI',sans-serif;font-size:1.3rem;font-weight:600;}
  #start span{font-size:1rem;font-weight:400;color:rgba(103,201,250,.6);}
  @media (prefers-reduced-motion:reduce){.dot{animation:none;}}
</style>
</head>
<body data-state="idle">
<canvas id="c"></canvas>
<div id="ui">
  <div id="state" aria-live="polite"><span class="dot"></span><span id="stateTxt"></span></div>
  <p id="heard" dir="auto"></p>
  <p id="reply" dir="auto" aria-live="polite"></p>
  <div id="hint"><span id="hintEn"></span><span id="hintAr" dir="rtl" lang="ar"></span></div>
</div>
<button id="start">Tap to start<span dir="rtl" lang="ar">اضغطوا للبدء</span></button>

<script id="vert" type="x-shader/x-vertex">
attribute vec2 p;
void main(){ gl_Position = vec4(p,0.0,1.0); }
</script>
<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform float u_energy;
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+2.0*C.xxx; vec3 x3=x0-1.0+3.0*C.xxx;
  i=mod(i,289.0);
  vec4 pp=permute(permute(permute(
      i.z+vec4(0.0,i1.z,i2.z,1.0))
    + i.y+vec4(0.0,i1.y,i2.y,1.0))
    + i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=1.0/7.0; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=pp-49.0*floor(pp*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){v+=a*snoise(p);p*=2.0;a*=0.5;} return v; }
void main(){
  vec2 uv=(gl_FragCoord.xy-vec2(0.5,0.56)*u_res)/min(u_res.x,u_res.y); // orb a little high, captions below
  float t=u_time*0.12;
  float energy=u_energy;
  float radius=0.30*(1.0+0.015*sin(u_time*0.9)+0.05*energy);
  float r=length(uv);
  vec3 blue=vec3(0.02,0.02,0.94);
  vec3 sky =vec3(0.40,0.79,0.98);
  vec3 col=vec3(0.0);
  float glow=smoothstep(radius+0.30,radius-0.02,r);
  col+=mix(blue,sky,0.35)*pow(glow,2.2)*(0.35+0.35*energy);
  if(r<radius){
    float z=sqrt(max(radius*radius-r*r,0.0));
    vec3 n=normalize(vec3(uv,z));
    vec3 q=n*1.7+vec3(0.0,0.0,t);
    float f=fbm(q+fbm(q*0.5+t)*0.4);
    f=0.5+0.5*f;
    vec3 base=mix(blue,sky,smoothstep(0.25,0.95,f+0.15*energy));
    float core=smoothstep(radius,0.0,r);
    base+=sky*pow(core,3.0)*(0.45+0.4*energy);
    float fres=pow(1.0-z/radius,2.6);
    base+=sky*fres*0.9;
    float edge=smoothstep(radius,radius-0.03,r);
    col=mix(col,base,edge);
  }
  col=col/(col+vec3(0.6))*1.35;
  gl_FragColor=vec4(col,1.0);
}
</script>

<script>
/* ---------- orb ---------- */
const cv=document.getElementById('c');
const gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,document.getElementById('vert').textContent));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,document.getElementById('frag').textContent));
gl.linkProgram(prog);gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uRes=gl.getUniformLocation(prog,'u_res');
const uTime=gl.getUniformLocation(prog,'u_time');
const uEnergy=gl.getUniformLocation(prog,'u_energy');
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();
const E={idle:0.0,listening:0.55,thinking:0.25,speaking:1.0};
let energy=0,target=0;
function setState(s){target=E[s]??0;}
const t0=performance.now();
(function frame(now){
  energy+=(target-energy)*0.05;
  gl.uniform2f(uRes,cv.width,cv.height);
  gl.uniform1f(uTime,(now-t0)/1000);
  gl.uniform1f(uEnergy,energy);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
})(t0);

/* ---------- push-to-talk: hold SPACE (or press and hold the screen) -> record -> release -> POST /voice -> play reply ---------- */
const $=id=>document.getElementById(id);
const HOLD=matchMedia('(pointer:coarse)').matches
  ?["Press and hold to talk to Ra'ad",'اضغطوا مطولاً وكلّموا رعد']
  :["Hold SPACE to talk to Ra'ad",'اضغطوا مطولاً على زر المسافة وكلّموا رعد'];
const RETRY=['Something went wrong. Hold and try again.','صار خلل، جربوا مرة ثانية'];
const MISSED=["Didn't catch that. Hold and try again.",'ما سمعناكم زين، جربوا مرة ثانية'];
const SHORT=['Keep holding while you talk.','استمروا بالضغط وانتوا تتكلمون'];
const MIC=['Microphone is blocked. Allow it and reload.','المايك مقفول، اسمحوا له وحدّثوا الصفحة'];
const STATES={listening:'LISTENING · أسمعكم',thinking:'THINKING · لحظة',speaking:'SPEAKING · رعد يتكلم'};
/* one place for every screen state: orb energy, status pill, idle prompt */
function ui(state,hint){
  document.body.dataset.state=state;setState(state);
  $('stateTxt').textContent=STATES[state]||'';
  const h=hint||HOLD;$('hintEn').textContent=h[0];$('hintAr').textContent=h[1];
}
function show(heard,reply){$('heard').textContent=heard||'';$('reply').textContent=reply||'';}
ui('idle');
let busy=false;   // true while thinking/speaking — key ignored

async function startLoop(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:{
    echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ?'audio/webm;codecs=opus':'audio/mp4';

  const MIN_MS=300;
  let rec=null,chunks=[],started=0;

  ui('idle');

  function begin(){
    if(busy||rec)return;
    rec=new MediaRecorder(stream,{mimeType:mime});chunks=[];
    rec.ondataavailable=ev=>chunks.push(ev.data);
    rec.start();started=performance.now();
    show('','');ui('listening');
  }

  function end(){
    if(!rec)return;
    const dur=performance.now()-started;
    rec.onstop=()=>{ if(dur>MIN_MS) send(new Blob(chunks,{type:mime}));
                     else ui('idle',SHORT); };
    rec.stop();rec=null;
  }

  addEventListener('keydown',e=>{
    if(e.code!=='Space')return;
    e.preventDefault();
    if(!e.repeat)begin();
  });

  addEventListener('keyup',e=>{
    if(e.code!=='Space'||!rec)return;
    e.preventDefault();
    end();
  });

  // phone: press and hold anywhere on the screen
  addEventListener('pointerdown',e=>{ if(!e.button)begin(); });
  addEventListener('pointerup',end);
  addEventListener('pointercancel',end);
  addEventListener('contextmenu',e=>e.preventDefault());

  async function send(blob){
    busy=true;ui('thinking');
    try{
      const r=await fetch('/voice',{method:'POST',
        headers:{'Content-Type':blob.type,'X-PTT':'1'},body:blob});
      if(r.status===401){location.href='/login';return;}
      const d=await r.json();
      if(d.error)console.warn(d.error);
      if(!d.woke){ ui('idle',d.error?RETRY:MISSED);busy=false;return; }
      show(d.heard,d.reply);
      const done=()=>{ui('idle');busy=false;};
      if(d.audio){
        const a=new Audio('data:audio/mp3;base64,'+d.audio);
        ui('speaking');
        a.onended=done;
        a.onerror=done;
        a.play().catch(done);
      }else{ui('idle',d.error?RETRY:HOLD);busy=false;}
    }catch(e){console.warn(e);ui('idle',RETRY);busy=false;}
  }
}

$('start').addEventListener('click',async e=>{
  e.currentTarget.remove();
  try{await startLoop();}catch(err){ui('idle',MIC);}
});
</script>
</body>
</html>
