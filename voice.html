<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Barq Racing · AI Assistant</title>
<style>
  :root{
    --sky:#67C9FA; --ink:#e6f6ff; --mute:rgba(103,201,250,.62); --line:rgba(103,201,250,.3);
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'SF Arabic','Geeza Pro','Noto Sans Arabic',Tahoma,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--font);
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;}

  header{display:flex;justify-content:space-between;align-items:center;
    padding:calc(18px + env(safe-area-inset-top)) 22px 0;font-size:.7rem;font-weight:600;letter-spacing:.22em;color:var(--mute);}
  .brand{display:flex;align-items:center;gap:10px;}
  .mark{height:20px;width:auto;display:block;}
  header .ar{letter-spacing:0;font-size:.85rem;font-weight:500;}

  #stage{position:relative;min-height:0;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;}
  header,#ui{position:relative;z-index:1;}
  .nogl #stage{background:radial-gradient(circle at 50% 50%,#67C9FA 0,#0a18d8 18%,#020a50 30%,#000 44%);}

  #ui{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;
    min-height:9.5rem;padding:4px 24px calc(30px + env(safe-area-inset-bottom));text-align:center;}
  #ui>p,#hint{width:100%;max-width:44rem;}
  #ui p:empty{display:none;}

  #state{display:none;align-items:center;gap:9px;padding:6px 14px 6px 12px;border-radius:999px;
    border:1px solid var(--line);background:rgba(103,201,250,.07);color:var(--sky);font-size:.76rem;font-weight:600;}
  body:not([data-state=idle]) #state{display:inline-flex;}
  #stateTxt{display:flex;align-items:center;gap:8px;}
  #stateTxt .en{letter-spacing:.14em;}
  #stateTxt .ar{font-size:.86rem;font-weight:500;}
  #stateTxt .sep{opacity:.45;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--sky);transition:transform .2s;}
  body[data-state=listening] .dot{background:#fff;}
  body[data-state=thinking] .dot{animation:pulse .7s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.25;transform:scale(.6);}}

  #heard{font-size:1rem;line-height:1.45;color:var(--mute);}
  #reply{font-weight:500;color:var(--ink);line-height:1.42;text-wrap:balance;
    font-size:clamp(1.2rem,4.8vw,1.95rem);}
  body[data-len=m] #reply{font-size:clamp(1.1rem,4.3vw,1.6rem);}
  body[data-len=l] #reply{font-size:clamp(1rem,3.9vw,1.3rem);line-height:1.5;}
  #reply,#heard{transition:opacity .35s ease;}
  body[data-state=listening] #reply,body[data-state=thinking] #reply{opacity:.35;}

  #hint{display:none;flex-direction:column;gap:5px;}
  body[data-state=idle] #hint{display:flex;}
  body.has-reply #hint{padding-top:6px;}
  #hintEn{font-size:1.05rem;font-weight:600;color:var(--sky);}
  #hintAr{font-size:1rem;color:var(--mute);}

  #start{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
    background:rgba(0,0,0,.86);color:var(--sky);border:0;cursor:pointer;font:600 1.3rem var(--font);}
  #start span{font-size:1rem;font-weight:400;color:var(--mute);}
  #start:focus-visible{outline:2px solid var(--sky);outline-offset:-10px;}
  @media (min-width:900px){ #ui{padding-bottom:calc(44px + env(safe-area-inset-bottom));} header{padding:26px 34px 0;} }
  @media (prefers-reduced-motion:reduce){.dot{animation:none!important;} #reply,#heard{transition:none;}}
</style>
</head>

<script id="vert" type="x-shader/x-vertex">
attribute vec2 p;
void main(){ gl_Position = vec4(p,0.0,1.0); }
</script>
<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 u_c;       // orb centre, px
uniform float u_r;      // orb radius, px
uniform float u_time;
uniform float u_lv;     // voice level 0..1
uniform vec4 u_w;       // state weights: idle, listening, thinking, speaking
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+2.0*C.xxx; vec3 x3=x0-1.0+3.0*C.xxx;
  i=mod(i,289.0);
  vec4 pp=permute(permute(permute(
      i.z+vec4(0.0,i1.z,i2.z,1.0))
    + i.y+vec4(0.0,i1.y,i2.y,1.0))
    + i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=1.0/7.0; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=pp-49.0*floor(pp*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){v+=a*snoise(p);p*=2.03;a*=0.5;} return v; }
void main(){
  vec2 uv=(gl_FragCoord.xy-u_c)/u_r;
  float t=u_time, lv=u_lv;
  float listen=u_w.y, think=u_w.z, speak=u_w.w;
  // listening: the orb draws in and tightens; speaking: it swells with every syllable
  float R=1.0+0.018*sin(t*0.9)*(1.0-speak)-0.06*listen+0.03*listen*lv+0.10*speak*lv;
  float r=length(uv);
  vec3 deep =vec3(0.010,0.050,0.40);
  vec3 blue =vec3(0.010,0.110,0.92);
  vec3 sky  =vec3(0.21,0.75,0.97);
  vec3 white=vec3(0.60,0.90,1.0);
  vec3 col=vec3(0.0);
  float d=max(r-R,0.0);
  // a tight halo, not a fog: it only opens up while Ra'ad speaks
  col+=mix(blue,sky,0.25)*exp(-d*(6.0-3.0*speak*lv))*(0.16+0.30*speak*lv+0.06*think);
  // listening: a thin ring hovers just outside the surface and breathes with the mic
  float ring=exp(-pow((r-R*(1.09+0.07*lv))*34.0,2.0));
  col+=sky*ring*listen*(0.30+0.70*lv);
  if(r<R){
    float z=sqrt(max(R*R-r*r,0.0))/R;
    vec3 n=normalize(vec3(uv/R,z));
    float sp=0.08+0.22*speak+0.10*think;
    vec3 q=n*(1.55-0.25*listen)+vec3(0.0,t*0.03,t*sp);
    float warp=fbm(q*0.5+t*0.04);
    float f=0.5+0.5*fbm(q+warp*0.55);
    float vein=pow(1.0-abs(snoise(q*1.3+warp*0.9+vec3(t*sp*0.6))),7.0);   // thin electric filaments
    float shade=0.5+0.5*dot(n,normalize(vec3(-0.35,0.55,0.75)));
    vec3 base=mix(deep,blue,smoothstep(0.15,0.62,f))*(0.55+0.6*shade);
    base+=sky*vein*(0.45+0.25*listen+0.9*speak*lv)*(0.4+0.6*shade);
    base+=white*pow(z,3.0)*(0.08+0.40*speak*lv+0.10*listen);
    float fres=pow(1.0-z,3.0);
    base+=sky*fres*(0.55+0.35*listen);
    base*=1.0-0.35*think;                                               // thinking: the orb goes quiet
    float ang=atan(uv.y,uv.x);
    base+=white*pow(0.5+0.5*cos(ang-t*2.6),16.0)*fres*think*1.6;   // thinking: a highlight circles the rim
    base+=white*pow(max(dot(n,normalize(vec3(-0.45,0.6,0.66))),0.0),28.0)*0.22;
    col=mix(col,base,smoothstep(R,R-1.6/u_r,r));
  }
  col=col/(col+vec3(0.55))*1.42;
  gl_FragColor=vec4(col,1.0);
}
</script>

const MISSED=["Didn't catch that. Hold and try again.",'ما سمعناكم زين، جربوا مرة ثانية'];
const SHORT=['Keep holding while you talk.','استمروا بالضغط وانتوا تتكلمون'];
const MIC=['Microphone is blocked. Allow it and reload.','المايك مقفول، اسمحوا له وحدّثوا الصفحة'];
const STATES={listening:'LISTENING · أسمعكم',thinking:'THINKING · لحظة',speaking:'SPEAKING · رعد يتكلم'};
let STATE='idle';
const on={state:[],show:[]};          // visual hooks
/* status text: same words as voice.html, split so the Arabic half is never letter-spaced */
function stateText(s){
  const el=$('stateTxt'),[en,ar]=(STATES[s]||'').split(' · ');
  el.textContent='';el.setAttribute('aria-label',STATES[s]||'');
  if(!en)return;
  const a=document.createElement('span');a.className='en';a.textContent=en;
  const d=document.createElement('span');d.className='sep';d.textContent='·';d.setAttribute('aria-hidden','true');
  const b=document.createElement('span');b.className='ar';b.lang='ar';b.dir='rtl';b.textContent=ar;
  el.append(a,d,b);
}
/* one place for every screen state: visual, status, idle prompt */
function ui(state,hint){
  document.body.dataset.state=state;STATE=state;stateText(state);
  const h=hint||HOLD;$('hintEn').textContent=h[0];$('hintAr').textContent=h[1];
  on.state.forEach(f=>f(state));
}
function show(heard,reply){
  $('heard').textContent=heard||'';$('reply').textContent=reply||'';
  const n=(reply||'').length;document.body.dataset.len=n>200?'l':n>90?'m':'s';
  document.body.classList.toggle('has-reply',!!reply);
  on.show.forEach(f=>f());
}

/* ---------- audio level: mic while listening, reply audio while speaking ---------- */
const AU={ctx:null,mic:null,out:null};
const TD=new Float32Array(1024),FD=new Uint8Array(512);
function mkAn(){const a=AU.ctx.createAnalyser();a.fftSize=1024;a.smoothingTimeConstant=.7;return a;}
function audioInit(){   // inside the tap gesture, so the context is allowed to run
  try{AU.ctx=new(window.AudioContext||window.webkitAudioContext)();AU.ctx.resume();}catch(e){AU.ctx=null;}
}
function micTap(stream){
  if(!AU.ctx)return;
  try{AU.mic=mkAn();const g=AU.ctx.createGain();g.gain.value=0;
    AU.ctx.createMediaStreamSource(stream).connect(AU.mic);AU.mic.connect(g);g.connect(AU.ctx.destination);
  }catch(e){AU.mic=null;}
}
function playTap(a){    // route through Web Audio only while it runs, else plain playback
  if(!AU.ctx||AU.ctx.state!=='running')return;
  try{if(!AU.out){AU.out=mkAn();AU.out.connect(AU.ctx.destination);}
    AU.ctx.createMediaElementSource(a).connect(AU.out);}catch(e){}
}
function analyser(){return STATE==='listening'?AU.mic:STATE==='speaking'?AU.out:null;}
function fake(t){       // demo: a speech-like envelope, about 4 syllables a second
  if(STATE==='speaking'){const syl=Math.pow(Math.max(0,Math.sin(t*26)),.6),phr=.6+.4*Math.sin(t*1.7)*Math.sin(t*.63+1);
    return Math.max(0,.12+.78*syl*phr+.06*Math.sin(t*63));}
  if(STATE==='listening'){const syl=Math.pow(Math.max(0,Math.sin(t*22+1)),.8);return .08+.55*syl*(.6+.4*Math.sin(t*2.1));}
  return 0;
}
let LV=0;
function level(t){      // once per frame, t in seconds; 0..1 smoothed
  let raw=0;
  if(DEMO)raw=fake(t);
  else{const an=analyser();if(an){an.getFloatTimeDomainData(TD);let s=0;for(let i=0;i<TD.length;i++)s+=TD[i]*TD[i];
    raw=Math.min(1,Math.sqrt(s/TD.length)*4.5);}}
  LV+=(raw-LV)*(raw>LV?.4:.12);
  return LV;
}

show('','');ui('idle');
let busy=false;   // true while thinking/speaking, key ignored

async function startLoop(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:{
    echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  micTap(stream);
  const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ?'audio/webm;codecs=opus':'audio/mp4';

  const MIN_MS=300;
  let rec=null,chunks=[],started=0;

  ui('idle');

  function begin(){
    if(busy||rec)return;
    rec=new MediaRecorder(stream,{mimeType:mime});chunks=[];
    rec.ondataavailable=ev=>chunks.push(ev.data);
    rec.start();started=performance.now();
    show('','');ui('listening');
  }

  function end(){
    if(!rec)return;
    const dur=performance.now()-started;
    rec.onstop=()=>{ if(dur>MIN_MS) send(new Blob(chunks,{type:mime}));
                     else ui('idle',SHORT); };
    rec.stop();rec=null;
  }

  addEventListener('keydown',e=>{
    if(e.code!=='Space')return;
    e.preventDefault();
    if(!e.repeat)begin();
  });

  addEventListener('keyup',e=>{
    if(e.code!=='Space'||!rec)return;
    e.preventDefault();
    end();
  });

  // phone: press and hold anywhere on the screen
  addEventListener('pointerdown',e=>{ if(!e.button)begin(); });
  addEventListener('pointerup',end);
  addEventListener('pointercancel',end);
  addEventListener('contextmenu',e=>e.preventDefault());

  async function send(blob){
    busy=true;ui('thinking');
    try{
      const r=await fetch('/voice',{method:'POST',
        headers:{'Content-Type':blob.type,'X-PTT':'1'},body:blob});
      if(r.status===401){location.href='/login';return;}
      const d=await r.json();
      if(d.error)console.warn(d.error);
      if(!d.woke){ ui('idle',d.error?RETRY:MISSED);busy=false;return; }
      show(d.heard,d.reply);
      if(d.audio){
        const bin=atob(d.audio),u8=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
        const url=URL.createObjectURL(new Blob([u8],{type:'audio/mpeg'}));   // blob: is same-origin, safe for Web Audio
        const done=()=>{URL.revokeObjectURL(url);ui('idle');busy=false;};
        const a=new Audio(url);
        playTap(a);
        ui('speaking');
        a.onended=done;
        a.onerror=done;
        a.play().catch(done);
      }else{ui('idle',d.error?RETRY:HOLD);busy=false;}
    }catch(e){console.warn(e);ui('idle',RETRY);busy=false;}
  }
}


/* ---------- orb ---------- */
(function(){
  const cv=$('c'),stage=$('stage');
  const gl=cv.getContext('webgl',{antialias:false,alpha:false})||cv.getContext('experimental-webgl');
  if(!gl){document.body.classList.add('nogl');return;}
  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
  const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,$('vert').textContent));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,$('frag').textContent));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(prog,n);
  const uC=U('u_c'),uR=U('u_r'),uT=U('u_time'),uLv=U('u_lv'),uW=U('u_w');
  const dpr=Math.min(window.devicePixelRatio||1,1.5);
  let R=0;
  let box={x:0,y:0,w:1,h:1};
  function resize(){cv.width=Math.max(1,innerWidth*dpr|0);cv.height=Math.max(1,innerHeight*dpr|0);
    gl.viewport(0,0,cv.width,cv.height);const r=stage.getBoundingClientRect();
    box={x:(r.left+r.width/2)*dpr,y:cv.height-(r.top+r.height/2)*dpr,w:r.width*dpr,h:r.height*dpr};}
  new ResizeObserver(resize).observe(stage);addEventListener('resize',resize);resize();
  const IDX={idle:0,listening:1,thinking:2,speaking:3},w=[1,0,0,0];
  const t0=performance.now();
  (function frame(now){
    const t=(now-t0)/1000,lv=level(t)*(RM?.25:1);
    const k=IDX[STATE]||0;for(let i=0;i<4;i++)w[i]+=((i===k?1:0)-w[i])*.06;
    const target=Math.min(box.w*.38,box.h*.36);
    R=R?R+(target-R)*.08:target;
    gl.uniform2f(uC,box.x,box.y);gl.uniform1f(uR,R);
    gl.uniform1f(uT,RM?t*.2:t);gl.uniform1f(uLv,lv);gl.uniform4f(uW,w[0],w[1],w[2],w[3]);
    gl.drawArrays(gl.TRIANGLES,0,3);
    $('dot').style.transform=STATE==='listening'||STATE==='speaking'?`scale(${1+lv*.9})`:'';
    requestAnimationFrame(frame);
  })(t0);
})();
/* ---------- demo: ?demo or opened from disk. No mic, loops the four states.
   ?demo&state=speaking&ex=1 freezes one state (ex: 0 English, 1 Arabic, 2 long) ---------- */
const EX=[["How fast is BOLT?","Fast enough to make lightning jealous. Our best run is 0.920 seconds."],
          ["منو هجين؟","هجين هو تميمة الفريق، جمل سباق أزرق بلون برق."],
          ["What makes your car different from the other teams, and how did you test it?",
           "We shaped BOLT around one idea: less drag, same grip. The body went through dozens of CFD runs, then we printed the best three and raced them on the track. The winner was 0.04 seconds quicker every single run, and that is the car you see here."]];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function demo(){
  const hold=Q.get('state'),ex=EX[+Q.get('ex')||0]||EX[0];
  if(hold){if(hold==='speaking'||Q.has('text'))show(ex[0],ex[1]);ui(hold);return;}
  for(let i=0;;i=(i+1)%2){
    ui('idle');await wait(2800);
    show('','');ui('listening');await wait(2600);
    ui('thinking');await wait(1500);
    show(EX[i][0],EX[i][1]);ui('speaking');await wait(5600);
  }
}
if(DEMO){$('start').remove();demo();}
else $('start').addEventListener('click',async e=>{
  e.currentTarget.remove();
  audioInit();
  try{await startLoop();}catch(err){ui('idle',MIC);}
});

</script>
